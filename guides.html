<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>攻略资讯 - Galgame 资源站</title>
  <meta name="description" content="攻略、评测与业界资讯，支持分类筛选与关键词搜索。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="guides">
  <header id="site-header"></header>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2>攻略与资讯</h2>
        <span class="more" id="guide-count">共 0 篇</span>
      </div>

      <div class="toolbar">
        <input id="guide-search" type="search" placeholder="搜索标题 / 摘要 / 标签…" autocomplete="off">
      </div>

      <div class="chips" id="guide-cats" style="margin-bottom:22px"></div>

      <div class="post-list" id="guide-list"></div>
      <div class="empty" id="guide-empty" style="display:none">没有符合条件的文章。</div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
</body>
</html>
