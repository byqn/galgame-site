<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资源库 - Galgame 资源站</title>
  <meta name="description" content="全部作品索引，支持关键词搜索、标签筛选与更新时间 / 评分 / 发售日排序。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="library">
  <header id="site-header"></header>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2>资源库</h2>
        <span class="more" id="lib-count">共 0 部作品</span>
      </div>

      <div class="toolbar">
        <input id="lib-search" type="search" placeholder="搜索作品名 / 原题 / 社团 / 简介…" autocomplete="off">
        <select id="lib-sort" aria-label="排序方式">
          <option value="updated">按更新时间</option>
          <option value="rating">按评分</option>
          <option value="release">按发售日期</option>
          <option value="title">按标题</option>
        </select>
      </div>

      <div class="chips" id="lib-tags" style="margin-bottom:22px"></div>

      <div class="grid" id="lib-grid"></div>
      <div class="empty" id="lib-empty" style="display:none">没有符合条件的作品，换个关键词或标签试试。</div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
</body>
</html>
