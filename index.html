<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galgame 资源站 - 一站式 Galgame 资源索引</title>
  <meta name="description" content="一站式 Galgame 资源索引：最新作品、高分推荐、会社与标签检索、补丁与教程。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <header id="topbar"></header>

  <main class="wrap">
    <!-- Hero：左侧介绍卡 + 右侧公告卡 -->
    <section class="hero-grid">
      <div class="hero-main">
        <h1>一站式 <em>Galgame</em> 资源索引</h1>
        <p>免费、干净的 Galgame 作品资料库：按标签、会社、平台、语言快速检索，补丁与教程一处找齐。</p>
        <div class="social-row" id="social-row"></div>
      </div>
      <div id="notice-card"></div>
    </section>

    <!-- 快捷入口 -->
    <section class="quick-row">
      <a class="quick" href="tag.html">
        <span class="qi p">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8a2 2 0 0 1 2-2H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/><circle cx="7.6" cy="7.6" r="1.4" fill="currentColor" stroke="none"/></svg>
        </span>
        <span>
          <span class="qt">标签检索</span>
          <span class="qs" id="q-tag">—</span>
        </span>
      </a>
      <a class="quick" href="company.html">
        <span class="qi k">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v15"/><path d="M15 10h4a1 1 0 0 1 1 1v10"/><path d="M2.5 21h19"/><path d="M7.5 9h3M7.5 13h3M7.5 17h3"/></svg>
        </span>
        <span>
          <span class="qt">游戏会社</span>
          <span class="qs" id="q-company">—</span>
        </span>
      </a>
      <a class="quick" href="resource.html">
        <span class="qi g">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M17.25 13.5v7.5M13.5 17.25h7.5"/></svg>
        </span>
        <span>
          <span class="qt">补丁与教程</span>
          <span class="qs" id="q-resource">—</span>
        </span>
      </a>
    </section>

    <!-- 最新 Galgame -->
    <section class="section">
      <div class="section-head">
        <h2>最新 Galgame</h2>
        <span class="count">共 <span id="stat-games">0</span> 部收录</span>
        <a class="more" href="galgame.html">查看更多 →</a>
      </div>
      <div class="ggrid" id="latest-grid"></div>
    </section>

    <!-- 高分榜 -->
    <section class="section">
      <div class="section-head">
        <h2>高分推荐</h2>
        <a class="more" href="galgame.html?sort=rating">更多高分 →</a>
      </div>
      <div class="ggrid" id="top-grid"></div>
    </section>

    <!-- 最新补丁 -->
    <section class="section">
      <div class="section-head">
        <h2>最新补丁与教程</h2>
        <span class="count">共 <span id="stat-posts">0</span> 条资源</span>
        <a class="more" href="resource.html">全部资源 →</a>
      </div>
      <div class="panel" style="margin-top:0" id="patch-list"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
</body>
</html>
